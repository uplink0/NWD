version: '3.8'

services:
  # --- База данных MediaWiki ---
  mediawiki-db:
    image: mariadb:10.11
    container_name: nwd-db
    restart: always
    environment:
      MYSQL_DATABASE: mediawiki
      MYSQL_USER: wikiuser
      MYSQL_PASSWORD: wikipass
      MYSQL_ROOT_PASSWORD: rootpass
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - nwd-net
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Приложение MediaWiki ---
  mediawiki-app:
    image: mediawiki:1.40
    container_name: nwd-mediawiki
    restart: always
    environment:
      MEDIAWIKI_DB_HOST: mediawiki-db
      MEDIAWIKI_DB_USER: wikiuser
      MEDIAWIKI_DB_PASSWORD: wikipass
      MEDIAWIKI_DB_NAME: mediawiki
    volumes:
      - mediawiki_data:/var/www/html/images
      - ./LocalSettings.php:/var/www/html/LocalSettings.php
    depends_on:
      mediawiki-db:
        condition: service_healthy
    networks:
      - nwd-net

  # --- Nginx как обратный прокси ---
  nginx:
    image: nginx:alpine
    container_name: nwd-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - mediawiki-app
    networks:
      - nwd-net

  # --- cAdvisor для сбора метрик контейнеров ---
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: nwd-cadvisor
    restart: always
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - nwd-net

  # --- Prometheus ---
  prometheus:
    image: prom/prometheus:latest
    container_name: nwd-prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - nwd-net

  # --- Grafana ---
  grafana:
    image: grafana/grafana:latest
    container_name: nwd-grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - nwd-net

volumes:
  db_data:
  mediawiki_data:
  prometheus_data:
  grafana_data:

networks:
  nwd-net:
    driver: bridge
